name: Tidy Place Show on Map

on:
  push:
    branches:
      - fix/place-show-on-map
    paths:
      - .github/workflows/patch-place-show-on-map.yml

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tidy inserted function
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          path = Path('src/screens/PlacePage.tsx')
          text = path.read_text()
          match = re.search(r"\n(const showPlaceOnMap = \(\) => \{.*?\n\};)\n\n\n  if \(!place\) \{", text, re.S)
          if not match:
              raise SystemExit('Inserted showPlaceOnMap block not found')
          tidied = textwrap.indent(match.group(1), '  ')
          text = text[:match.start()] + '\n' + tidied + '\n\n  if (!place) {' + text[match.end():]
          path.write_text(text)

      - name: Verify
        run: npm ci && npm run verify

      - name: Commit tidy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/PlacePage.tsx
          git commit -m "chore: tidy show on map action"
          git push
