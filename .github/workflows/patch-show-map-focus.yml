name: Patch Show on Map Focus

on:
  push:
    branches:
      - fix/show-map-focus
    paths:
      - .github/workflows/patch-show-map-focus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Focus externally selected place on map
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/screens/MapScreen.tsx')
          text = path.read_text()

          old = """  useEffect(() => {
    setSelectedPlaceId(initialSelectedPlaceId);
  }, [initialSelectedPlaceId]);
"""
          new = """  useEffect(() => {
    setSelectedPlaceId(initialSelectedPlaceId);
    if (!initialSelectedPlaceId) return;

    const place = places.find((candidate) => candidate.id === initialSelectedPlaceId);
    if (!place) return;

    const focusTimeoutId = window.setTimeout(() => {
      const map = mapRef.current;
      if (!map) return;

      setSelectedBarangayId(null);
      setPanelView('categories');
      setSheetLevel(1);
      setDragOffset(0);

      const target: [number, number] = [place.latitude, place.longitude];
      const zoom = Math.max(16, map.getZoom() || 16);
      if (prefersReducedMotion) {
        map.setView(target, zoom, { animate: false });
      } else {
        map.flyTo(target, zoom, { duration: 0.75 });
      }

      const panDelay = prefersReducedMotion ? 0 : 780;
      window.setTimeout(() => {
        if (mapRef.current !== map) return;
        const currentViewportHeight = Math.round(window.visualViewport?.height ?? window.innerHeight);
        map.panBy([0, Math.min(150, currentViewportHeight * 0.17)], {
          animate: !prefersReducedMotion,
          duration: prefersReducedMotion ? 0 : 0.35,
        });
      }, panDelay);
    }, 0);

    return () => window.clearTimeout(focusTimeoutId);
  }, [initialSelectedPlaceId, places, prefersReducedMotion]);
"""

          if old not in text:
              raise SystemExit('Expected initial selected-place effect not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Verify
        run: npm ci && npm run verify

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/MapScreen.tsx
          git commit -m "fix: focus map when opening a selected place"
          git push
