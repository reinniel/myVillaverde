name: Patch Show on Map Focus

on:
  push:
    branches:
      - fix/show-map-focus
    paths:
      - .github/workflows/patch-show-map-focus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Focus externally selected place on map
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/screens/MapScreen.tsx')
          text = path.read_text()
          old = "  useEffect(() => {\n    setSelectedPlaceId(initialSelectedPlaceId);\n  }, [initialSelectedPlaceId]);\n"
          new = (
              "  useEffect(() => {\n"
              "    setSelectedPlaceId(initialSelectedPlaceId);\n"
              "    if (!initialSelectedPlaceId) return;\n\n"
              "    const place = places.find((candidate) => candidate.id === initialSelectedPlaceId);\n"
              "    if (!place) return;\n\n"
              "    const focusTimeoutId = window.setTimeout(() => {\n"
              "      const map = mapRef.current;\n"
              "      if (!map) return;\n\n"
              "      setSelectedBarangayId(null);\n"
              "      setPanelView('categories');\n"
              "      setSheetLevel(1);\n"
              "      setDragOffset(0);\n\n"
              "      const target: [number, number] = [place.latitude, place.longitude];\n"
              "      const zoom = Math.max(16, map.getZoom() || 16);\n"
              "      if (prefersReducedMotion) {\n"
              "        map.setView(target, zoom, { animate: false });\n"
              "      } else {\n"
              "        map.flyTo(target, zoom, { duration: 0.75 });\n"
              "      }\n\n"
              "      const panDelay = prefersReducedMotion ? 0 : 780;\n"
              "      window.setTimeout(() => {\n"
              "        if (mapRef.current !== map) return;\n"
              "        const currentViewportHeight = Math.round(window.visualViewport?.height ?? window.innerHeight);\n"
              "        map.panBy([0, Math.min(150, currentViewportHeight * 0.17)], {\n"
              "          animate: !prefersReducedMotion,\n"
              "          duration: prefersReducedMotion ? 0 : 0.35,\n"
              "        });\n"
              "      }, panDelay);\n"
              "    }, 0);\n\n"
              "    return () => window.clearTimeout(focusTimeoutId);\n"
              "  }, [initialSelectedPlaceId, places, prefersReducedMotion]);\n"
          )
          if old not in text:
              raise SystemExit('Expected initial selected-place effect not found')
          path.write_text(text.replace(old, new, 1))

      - name: Verify
        run: npm ci && npm run verify

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/MapScreen.tsx
          git commit -m "fix: focus map when opening a selected place"
          git push
