name: Normalize README preview images

on:
  push:
    branches:
      - fix/readme-preview-images

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Normalize PNG previews
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path

          for path in (
              Path('docs/assets/villaverdeko-home.png'),
              Path('docs/assets/villaverdemo-home.png'),
          ):
              with Image.open(path) as image:
                  image.load()
                  image.save(path, format='PNG', optimize=True)

      - name: Validate PNG previews
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path

          for path in (
              Path('docs/assets/villaverdeko-home.png'),
              Path('docs/assets/villaverdemo-home.png'),
          ):
              with Image.open(path) as image:
                  image.verify()
              print(f'{path}: valid PNG')

      - name: Commit normalized previews
        shell: bash
        run: |
          rm .github/workflows/normalize-readme-previews.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/villaverdeko-home.png docs/assets/villaverdemo-home.png .github/workflows/normalize-readme-previews.yml
          git commit -m "fix: normalize README preview images"
          git push
