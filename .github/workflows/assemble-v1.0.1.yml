name: Assemble v1.0.1 candidate

on:
  push:
    branches:
      - fix/v1.0.1-review-hardening

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble candidate files
        shell: bash
        run: |
          cat .candidate-upload/PlacePage.tsx.part-* > src/screens/PlacePage.tsx
          cat .candidate-upload/SavedPlacesSheet.tsx.part-* > src/components/SavedPlacesSheet.tsx
          cat .candidate-upload/v101-remaining.b64.part-* > /tmp/v101-remaining.b64
          base64 --decode /tmp/v101-remaining.b64 > /tmp/v101-remaining.tar.xz
          echo "536995661b36c7fb0744af05fb7dd81c695a3ed24d6e3464f9ee218293a044f1  /tmp/v101-remaining.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v101-remaining.tar.xz -C .
          rm -rf .candidate-upload
          rm .github/workflows/assemble-v1.0.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden v1.0.1 release candidate"
          git push
