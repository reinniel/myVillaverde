name: Patch Rotating VillaverdeMo Hero

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-rotate-mo-hero.yml

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rotate-mo-barangay-hero
          fetch-depth: 0

      - name: Add rotating barangay headline
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/screens/VisitorDashboard.tsx')
          text = path.read_text()

          text = text.replace("import React, { useMemo } from 'react';", "import React, { useEffect, useMemo, useState } from 'react';", 1)

          anchor = "const getVisitorCategory = (id: GuideCategory['id']) =>\n  VISITOR_CATEGORIES.find((category) => category.id === id);\n"
          insert = """const ROTATING_BARANGAY_NAMES = [
  'Bintawan',
  'Cabuluan',
  'Ibung',
  'Nagbitin',
  'Ocapon',
  'Pieza',
  'Poblacion',
  'Sawmill',
] as const;

const getVisitorCategory = (id: GuideCategory['id']) =>
  VISITOR_CATEGORIES.find((category) => category.id === id);
"""
          if anchor not in text:
              raise SystemExit('Could not find visitor category anchor')
          text = text.replace(anchor, insert, 1)

          state_anchor = "  const availablePlaceCount = places.length;\n  const isLoading = dataState === 'loading' && availablePlaceCount === 0;\n  const isUnavailable = dataState !== 'loading' && availablePlaceCount === 0;\n"
          state_insert = """  const [rotatingBarangayIndex, setRotatingBarangayIndex] = useState(0);

  useEffect(() => {
    const intervalId = window.setInterval(() => {
      setRotatingBarangayIndex((currentIndex) =>
        (currentIndex + 1) % ROTATING_BARANGAY_NAMES.length);
    }, 2000);

    return () => window.clearInterval(intervalId);
  }, []);

  const rotatingBarangayName = ROTATING_BARANGAY_NAMES[rotatingBarangayIndex];
  const availablePlaceCount = places.length;
  const isLoading = dataState === 'loading' && availablePlaceCount === 0;
  const isUnavailable = dataState !== 'loading' && availablePlaceCount === 0;
"""
          if state_anchor not in text:
              raise SystemExit('Could not find dashboard state anchor')
          text = text.replace(state_anchor, state_insert, 1)

          headline = """            <h1 className=\"mt-2 font-serif-header text-[32px] font-bold leading-[1.02]\">
              See what Villaverde has to offer.
            </h1>
"""
          replacement = """            <h1
              className=\"mt-2 font-serif-header text-[32px] font-bold leading-[1.02]\"
              aria-label=\"See what Villaverde has to offer.\"
            >
              See what{' '}
              <span aria-hidden=\"true\" className=\"inline-block min-w-[9ch]\">
                {rotatingBarangayName}
              </span>{' '}
              has to offer.
            </h1>
"""
          if headline not in text:
              raise SystemExit('Could not find VillaverdeMo headline')
          text = text.replace(headline, replacement, 1)

          path.write_text(text)

      - name: Verify feature branch
        run: npm ci && npm run verify

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/VisitorDashboard.tsx
          git commit -m "feat: rotate VillaverdeMo barangay headline"
          git push origin HEAD:feature/rotate-mo-barangay-hero
