name: Smooth VillaverdeMo Barangay Rotation Main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/animate-mo-barangay-rotation-v2-main.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace snap-like swap with overlapping crossfade
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/screens/VisitorDashboard.tsx')
          text = path.read_text()

          old_state = """  const [rotatingBarangayIndex, setRotatingBarangayIndex] = useState(0);\n  const [barangaySwapPhase, setBarangaySwapPhase] = useState<'idle' | 'exit' | 'enter'>('idle');\n\n  useEffect(() => {\n    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let swapTimeoutId: number | undefined;\n    let enterFrameId: number | undefined;\n\n    const intervalId = window.setInterval(() => {\n      if (prefersReducedMotion) {\n        setRotatingBarangayIndex((currentIndex) =>\n          (currentIndex + 1) % ROTATING_BARANGAY_NAMES.length);\n        return;\n      }\n\n      setBarangaySwapPhase('exit');\n      swapTimeoutId = window.setTimeout(() => {\n        setRotatingBarangayIndex((currentIndex) =>\n          (currentIndex + 1) % ROTATING_BARANGAY_NAMES.length);\n        setBarangaySwapPhase('enter');\n        enterFrameId = window.requestAnimationFrame(() => {\n          setBarangaySwapPhase('idle');\n        });\n      }, 180);\n    }, 2000);\n\n    return () => {\n      window.clearInterval(intervalId);\n      if (swapTimeoutId !== undefined) window.clearTimeout(swapTimeoutId);\n      if (enterFrameId !== undefined) window.cancelAnimationFrame(enterFrameId);\n    };\n  }, []);\n\n  const rotatingBarangayName = ROTATING_BARANGAY_NAMES[rotatingBarangayIndex];\n  const rotatingBarangayClassName = barangaySwapPhase === 'exit'\n    ? 'opacity-0 -translate-y-1.5'\n    : barangaySwapPhase === 'enter'\n      ? 'opacity-0 translate-y-1.5'\n      : 'opacity-100 translate-y-0';\n"""

          new_state = """  const [rotatingBarangayIndex, setRotatingBarangayIndex] = useState(0);\n  const [isBarangayTransitioning, setIsBarangayTransitioning] = useState(false);\n\n  useEffect(() => {\n    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let transitionTimeoutId: number | undefined;\n\n    const intervalId = window.setInterval(() => {\n      if (prefersReducedMotion) {\n        setRotatingBarangayIndex((currentIndex) =>\n          (currentIndex + 1) % ROTATING_BARANGAY_NAMES.length);\n        return;\n      }\n\n      setIsBarangayTransitioning(true);\n      setRotatingBarangayIndex((currentIndex) =>\n        (currentIndex + 1) % ROTATING_BARANGAY_NAMES.length);\n\n      transitionTimeoutId = window.setTimeout(() => {\n        setIsBarangayTransitioning(false);\n      }, 460);\n    }, 2000);\n\n    return () => {\n      window.clearInterval(intervalId);\n      if (transitionTimeoutId !== undefined) window.clearTimeout(transitionTimeoutId);\n    };\n  }, []);\n\n  const rotatingBarangayName = ROTATING_BARANGAY_NAMES[rotatingBarangayIndex];\n  const previousBarangayName = ROTATING_BARANGAY_NAMES[\n    (rotatingBarangayIndex - 1 + ROTATING_BARANGAY_NAMES.length) % ROTATING_BARANGAY_NAMES.length\n  ];\n"""

          if old_state not in text:
              raise SystemExit('Could not find current animation state block')
          text = text.replace(old_state, new_state, 1)

          old_span = """              <span\n                aria-hidden=\"true\"\n                className={`inline-block min-w-[9ch] transform-gpu transition-[opacity,transform] duration-200 ease-out motion-reduce:transition-none ${rotatingBarangayClassName}`}\n              >\n                {rotatingBarangayName}\n              </span>{' '}\n"""

          new_span = """              <span aria-hidden=\"true\" className=\"relative inline-block min-w-[9ch] align-baseline\">\n                {isBarangayTransitioning && (\n                  <span\n                    key={`previous-${rotatingBarangayIndex}`}\n                    className=\"mo-barangay-name-out pointer-events-none absolute inset-x-0 top-0 inline-block\"\n                  >\n                    {previousBarangayName}\n                  </span>\n                )}\n                <span\n                  key={`current-${rotatingBarangayName}`}\n                  className={isBarangayTransitioning ? 'mo-barangay-name-in relative inline-block' : 'relative inline-block'}\n                >\n                  {rotatingBarangayName}\n                </span>\n              </span>{' '}\n"""

          if old_span not in text:
              raise SystemExit('Could not find current rotating name span')
          text = text.replace(old_span, new_span, 1)
          path.write_text(text)

          css_path = Path('src/index.css')
          css = css_path.read_text()
          addition = r'''

@keyframes mo-barangay-name-in {
  0% {
    opacity: 0;
    transform: translate3d(0, 0.34em, 0) scale(0.985);
    filter: blur(2.5px);
  }
  55% {
    opacity: 1;
  }
  100% {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
    filter: blur(0);
  }
}

@keyframes mo-barangay-name-out {
  0% {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
    filter: blur(0);
  }
  100% {
    opacity: 0;
    transform: translate3d(0, -0.28em, 0) scale(0.99);
    filter: blur(2px);
  }
}

.mo-barangay-name-in {
  animation: mo-barangay-name-in 440ms cubic-bezier(0.22, 1, 0.36, 1) both;
  will-change: opacity, transform, filter;
}

.mo-barangay-name-out {
  animation: mo-barangay-name-out 360ms cubic-bezier(0.4, 0, 0.2, 1) both;
  will-change: opacity, transform, filter;
}

@media (prefers-reduced-motion: reduce) {
  .mo-barangay-name-in,
  .mo-barangay-name-out {
    animation: none;
  }
}
'''
          if '@keyframes mo-barangay-name-in' not in css:
              css_path.write_text(css + addition)

      - name: Verify
        run: npm ci && npm run verify

      - name: Commit smoother transition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/VisitorDashboard.tsx src/index.css
          git commit -m "fix: smooth VillaverdeMo barangay transition"
          git push
